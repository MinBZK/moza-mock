# Deploy naar ZAD (Operations Manager) via RijksICTGilde/zad-actions.
#
# Elke push/merge naar main bouwt de image (WireMock + stubs) en deployt die
# naar de 'dev'-deployment (https://wiremock-dev-mozam-chu.rig.prd1.gn2.quattro.rijksapps.nl).
#
# Vereiste repo-secrets:
#   ZAD_API_KEY — ZAD Operations Manager API key
#
# Vereiste env-var op de deployment in Operations Manager (component 'wiremock'):
#   WIREMOCK_OPTIONS: --admin-api-basic-auth <gebruiker>:<wachtwoord>
# Verder heeft WireMock geen app-config (geen DB).

name: ZAD Deploy

on:
  push:
    branches: [main]

concurrency:
  group: zad-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # GHCR vereist lowercase; github.repository is MinBZK/... (hoofdletters) → hardcode lowercase.
  IMAGE_NAME: minbzk/moza-mock
  ZAD_PROJECT_ID: mozam-chu

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # image pushen naar GHCR
    outputs:
      digest: ${{ steps.build.outputs.digest }} # immutable digest voor verse pull
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build + push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main-${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write # GitHub environment/deployment aanmaken
    environment:
      name: dev
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Deploy to ZAD
        id: deploy
        uses: RijksICTGilde/zad-actions/deploy@v4
        with:
          api-key: ${{ secrets.ZAD_API_KEY }}
          project-id: ${{ env.ZAD_PROJECT_ID }}
          deployment-name: dev
          component: wiremock
          # Deploy op digest (niet de mutable tag) zodat ZAD altijd de net gebouwde
          # image pullt i.p.v. een gecachete oude versie van dezelfde tag.
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build.outputs.digest }}
          wait-for-ready: 'true'
          health-endpoint: /__admin/health
          # Alleen 401 telt als gereed: WireMock draait en de admin-API vraagt om basic auth.
          health-status-codes: '401'
